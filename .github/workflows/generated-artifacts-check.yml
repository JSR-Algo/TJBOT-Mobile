name: Generated Artifact Guard

on:
  pull_request:
  push:
    branches:
      - main
      - jason/main

permissions:
  contents: read

jobs:
  generated-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject generated and local-only files
        run: node scripts/check-generated-artifacts.mjs --tracked
