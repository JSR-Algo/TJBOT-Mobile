name: Generated Artifact Guard

on:
  pull_request:
  push:
    branches:
      - main
      - jason/main

permissions:
  contents: read

jobs:
  generated-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify generated-artifact policy fixtures
        run: npm run check:generated-artifacts:self-test
      - name: Reject generated and local-only tracked files
        run: npm run check:generated-artifacts
