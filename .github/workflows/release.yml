name: Mobile Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      lane:
        description: 'Fastlane lane to run (ios | android | both)'
        required: true
        default: 'both'
        type: choice
        options:
          - ios
          - android
          - both

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios-release:
    name: ios-release
    if: ${{ github.event_name == 'push' || github.event.inputs.lane == 'ios' || github.event.inputs.lane == 'both' }}
    runs-on: macos-latest
    timeout-minutes: 90

    env:
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
      APP_STORE_CONNECT_API_KEY_PATH: ${{ github.workspace }}/fastlane/AuthKey.json
      FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
      FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
      FASTLANE_ITC_TEAM_ID: ${{ secrets.FASTLANE_ITC_TEAM_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install JS dependencies
        run: npm ci

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Materialize App Store Connect API key
        run: |
          mkdir -p fastlane
          cat > fastlane/AuthKey.json <<JSON
          {
            "key_id": "${APP_STORE_CONNECT_API_KEY_ID}",
            "issuer_id": "${APP_STORE_CONNECT_API_KEY_ISSUER_ID}",
            "key": $(printf '%s' "${APP_STORE_CONNECT_API_KEY_CONTENT}" | base64 --decode | jq -Rs .),
            "in_house": false
          }
          JSON

      - name: Run Fastlane beta_ios
        run: bundle exec fastlane ios beta_ios

      - name: Scrub API key
        if: always()
        run: rm -f fastlane/AuthKey.json

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-${{ github.ref_name }}
          path: build/ios/*.ipa
          if-no-files-found: ignore
          retention-days: 30

  android-release:
    name: android-release
    if: ${{ github.event_name == 'push' || github.event.inputs.lane == 'android' || github.event.inputs.lane == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_PLAY_JSON_KEY: ${{ github.workspace }}/fastlane/play-key.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install JS dependencies
        run: npm ci

      - name: Materialize Android keystore
        run: |
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/release.keystore

      - name: Materialize Play Console service-account key
        env:
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
        run: |
          mkdir -p fastlane
          printf '%s' "${PLAY_JSON}" > fastlane/play-key.json

      - name: Run Fastlane beta_android
        run: bundle exec fastlane android beta_android

      - name: Scrub credentials
        if: always()
        run: |
          rm -f android/app/release.keystore
          rm -f fastlane/play-key.json

      - name: Upload AAB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.ref_name }}
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          retention-days: 30
