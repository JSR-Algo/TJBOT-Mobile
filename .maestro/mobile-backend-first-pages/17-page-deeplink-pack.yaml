- extendedWaitUntil:
    visible:
      id: "homePrimaryCta"
    timeout: 15000
    optional: true
- swipe:
    direction: DOWN
    optional: true
- takeScreenshot: "output/maestro/mobile-backend-first-pages/shots/01-HomeHubScreen"
- back
- waitForAnimationToEnd:
    optional: true
