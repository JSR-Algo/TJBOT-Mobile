appId: net.jasonle.tjbot
name: Mobile-backend-first ≥17-page deep-link pack
---
# Soft launch — retain auth; no clearState / no product instrumentation
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "appRoot"
    timeout: 60000
# Prefer authenticated home if session retained
- openLink: "tjbot://home/home-hub"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "homePrimaryCta"
    timeout: 45000
    optional: true
- takeScreenshot: "output/maestro/mobile-backend-first-pages/shots/00-auth-home-probe"
# --- 01 HomeHubScreen ---
- openLink: "tjbot://home/home-hub"
