appId: net.jasonle.tjbot
name: Strict 22-page deep-link recapture (required asserts)
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "appRoot"
    timeout: 60000
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- openLink: "tjbot://home/home-hub"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: "homePrimaryCta"
    timeout: 45000
    optional: true
- takeScreenshot: "output/maestro/mobile-backend-first-pages/shots-v2/00-auth-home-probe"
# --- 01 HomeHubScreen ---
- openLink: "tjbot://home/home-hub"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: "appRoot"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "homePrimaryCta"
    timeout: 15000
- takeScreenshot: "output/maestro/mobile-backend-first-pages/shots-v2/01-HomeHubScreen"
- back
- waitForAnimationToEnd
