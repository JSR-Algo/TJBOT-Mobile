appId: net.jasonle.tjbot
name: First five mobile MVP screens and screenshot pack
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "appRoot"
    timeout: 60000

# 01 — Overview / Today command
- openLink: "tjbot://home/home-hub"
- extendedWaitUntil:
    visible:
      id: "overviewPage"
    timeout: 45000
- runFlow:
    when:
      visible: ".*(Switch to English|Chuyển sang tiếng Anh).*"
    commands:
      - tapOn:
          id: "appShellLanguage"
- runFlow:
    when:
      visible: ".*Open debugger to view warnings.*"
    commands:
      - tapOn:
          point: "92%,91%"
- assertVisible:
    id: "appShellProfile"
- assertVisible:
    id: "appShellLanguage"
- assertVisible:
    id: "appShellSettings"
- assertVisible:
    id: "authenticatedAppShellTabs"
- takeScreenshot: "output/maestro/first-five/01-overview"

# 02 — Report detail
- openLink: "tjbot://home/home-hub"
- extendedWaitUntil:
    visible:
      id: "homeLessonReport"
    timeout: 30000
- tapOn:
    id: "homeLessonReport"
- extendedWaitUntil:
    visible:
      id: "reportDetailPage"
    timeout: 30000
- assertVisible: ".*(Report detail|Chi tiết báo cáo).*"
- takeScreenshot: "output/maestro/first-five/02-report-detail"

# 03 — Course library
- runFlow:
    when:
      visible: ".*Open debugger to view warnings.*"
    commands:
      - tapOn:
          point: "92%,93%"
- tapOn:
    id: "libraryTab"
- extendedWaitUntil:
    visible:
      id: "courseLibraryPage"
    timeout: 30000
- assertVisible: ".*(Course Library|Thư viện khóa học).*"
- takeScreenshot: "output/maestro/first-five/03-course-library"

# 04 — Course World Map
- tapOn:
    id: "featuredCourseCard"
- extendedWaitUntil:
    visible:
      id: "courseDetailPage"
    timeout: 30000
- assertVisible:
    id: "courseWorldMap"
- assertNotVisible: ".*(Send to Robot|Gửi đến Robot|Start lesson|Bắt đầu bài học).*"
- takeScreenshot: "output/maestro/first-five/04-course-world-map"

# 05 — Progress
- tapOn:
    id: "progressTab"
- extendedWaitUntil:
    visible: ".*(Your child's progress|Tiến độ của bé|progress|Tiến độ).*"
    timeout: 30000
- assertVisible:
    id: "authenticatedAppShellTabs"
- takeScreenshot: "output/maestro/first-five/05-progress"
