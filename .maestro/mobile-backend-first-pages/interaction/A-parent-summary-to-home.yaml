appId: net.jasonle.tjbot
name: A Summary product path back to Home
---
# CTA must sit above the floating tab bar after ParentScroll clearance fix.
- scrollUntilVisible:
    element:
      text: ".*(Return to child play area|Quay về khu vực chơi).*"
    direction: DOWN
    timeout: 25000
- tapOn: ".*(Return to child play area|Quay về khu vực chơi).*"
- waitForAnimationToEnd
# Unique Home postcondition — must not remain on Parent Space or Library.
- extendedWaitUntil:
    visible:
      id: "homePrimaryCta"
    timeout: 20000
- assertVisible:
    id: "homePrimaryCta"
- assertNotVisible: ".*(Parent Space|Khu vực phụ huynh|Return to child play area|Quay về khu vực chơi của trẻ).*"
