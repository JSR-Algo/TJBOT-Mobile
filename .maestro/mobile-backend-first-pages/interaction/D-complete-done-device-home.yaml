appId: net.jasonle.tjbot
name: D CourseComplete Done to Device Home
---
- extendedWaitUntil:
    visible:
      text: ".*(Lesson complete|Bài học đã hoàn tất|Xong|Done|Plan tomorrow).*"
    timeout: 20000
- tapOn: ".*(^Done$|^Xong$|Done|Xong).*"
- extendedWaitUntil:
    visible:
      text: ".*(Robot|Thiết bị|Pair|Ghép|Device|My Robot|Robot của).*"
    timeout: 20000
