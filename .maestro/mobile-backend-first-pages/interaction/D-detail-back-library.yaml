appId: net.jasonle.tjbot
name: D Detail Back to library
---
- runFlow:
    when:
      visible: ".*(Back to library|Về thư viện).*"
    commands:
      - tapOn: ".*(Back to library|Về thư viện).*"
- runFlow:
    when:
      visible: ".*(Go back|Quay lại).*"
    commands:
      - tapOn: ".*(Go back|Quay lại).*"
- extendedWaitUntil:
    visible:
      text: ".*(Barnyard Basics|Color Safari|Number Train|Course Library|Thư viện|Pick what|Chọn).*"
    timeout: 20000
