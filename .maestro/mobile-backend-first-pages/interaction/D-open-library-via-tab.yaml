appId: net.jasonle.tjbot
name: D Open library via tab
---
# Prefer true in-app tab navigation over deep-link alone (deep link can race to Devices).
- extendedWaitUntil:
    visible:
      text: ".*(Trang chủ|Home|Thiết bị|Library|Thư viện).*"
    timeout: 20000
- tapOn: ".*(Thư viện|Library).*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: ".*(Course Library|Thư viện khóa học|Barnyard Basics|Color Safari|Number Train|Pick what|Chọn).*"
    timeout: 25000
- assertVisible: ".*(Barnyard Basics|Color Safari|Number Train|Course Library|Thư viện khóa học).*"
