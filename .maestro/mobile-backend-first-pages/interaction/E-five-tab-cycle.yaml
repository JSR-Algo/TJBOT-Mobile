appId: net.jasonle.tjbot
name: E Five-tab cycle
---
- extendedWaitUntil:
    visible:
      id: "homePrimaryCta"
    timeout: 20000
# Devices
- tapOn: ".*(Thiết bị|Devices|Device).*"
- waitForAnimationToEnd
# Library
- tapOn: ".*(Thư viện|Library).*"
- waitForAnimationToEnd
# Progress
- tapOn: ".*(Tiến độ|Progress).*"
- waitForAnimationToEnd
# Profile
- tapOn: ".*(Hồ sơ|Profile).*"
- waitForAnimationToEnd
# Home
- tapOn: ".*(Trang chủ|Home).*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "homePrimaryCta"
    timeout: 20000
