appId: net.jasonle.tjbot
name: E Five-tab cycle
---
- extendedWaitUntil:
    visible:
      id: "homePrimaryCta"
    timeout: 20000
# Devices
- tapOn:
    id: "devicesTab"
- waitForAnimationToEnd
# Library
- tapOn:
    id: "libraryTab"
- waitForAnimationToEnd
# Progress
- tapOn:
    id: "progressTab"
- waitForAnimationToEnd
# Profile
- tapOn:
    id: "profileTab"
- waitForAnimationToEnd
# Home
- tapOn:
    id: "homeTab"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "homePrimaryCta"
    timeout: 20000
