appId: net.jasonle.tjbot
name: Nest spine — age gate through intro to login
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "appRoot"
    timeout: 60000

# COPPA age band
- runFlow:
    when:
      visible:
        id: "ageBandOption_18_PLUS"
    commands:
      - tapOn:
          id: "ageBandOption_18_PLUS"
      - tapOn:
          id: "ageScreenContinueButton"

# Welcome
- runFlow:
    when:
      visible:
        id: "getStartedButton"
    commands:
      - takeScreenshot: output/maestro/nest-spine/00-welcome
      - tapOn:
          id: "getStartedButton"

# Intro carousel (listen → speak → retry → celebrate) + Trust
- repeat:
    times: 6
    commands:
      - runFlow:
          when:
            visible:
              id: "introNextButton"
          commands:
            - tapOn:
                id: "introNextButton"
      - runFlow:
          when:
            visible:
              id: "trustContinueButton"
          commands:
            - tapOn:
                id: "trustContinueButton"

- extendedWaitUntil:
    visible:
      id: "loginScreenScroll"
    timeout: 45000
- assertVisible:
    id: "emailInput"
- assertVisible:
    id: "passwordInput"
- assertVisible:
    id: "submitButton"
- takeScreenshot: output/maestro/nest-spine/01-login
