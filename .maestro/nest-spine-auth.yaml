appId: net.jasonle.tjbot
name: Nest spine — age gate through intro to login
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "appRoot"
    timeout: 60000

# COPPA age band
- runFlow:
    when:
      visible:
        id: "ageBandOption_18_PLUS"
    commands:
      - tapOn:
          id: "ageBandOption_18_PLUS"
      - tapOn:
          id: "ageScreenContinueButton"

# Welcome
- runFlow:
    when:
      visible:
        id: "getStartedButton"
    commands:
      - takeScreenshot: output/maestro/nest-spine/00-welcome
      - tapOn:
          id: "getStartedButton"

# Intro carousel (listen → speak → retry → celebrate) + Trust
- repeat:
    times: 6
    commands:
      - runFlow:
          when:
            visible:
              id: "introNextButton"
          commands:
            - tapOn:
                id: "introNextButton"
      - runFlow:
          when:
            visible:
              id: "trustContinueButton"
          commands:
            - tapOn:
                id: "trustContinueButton"

- runFlow:
    when:
      visible:
        id: "trustScreen"
    commands:
      - scrollUntilVisible:
          element:
            id: "trustContinueButton"
          direction: DOWN
          centerElement: true
          timeout: 20000
      - tapOn:
          id: "trustContinueButton"

- extendedWaitUntil:
    visible:
      id: "loginScreenScroll"
    timeout: 45000
- assertVisible:
    id: "emailInput"
- assertVisible:
    id: "passwordInput"
- assertVisible:
    id: "submitButton"
- takeScreenshot: output/maestro/nest-spine/01-login

- tapOn:
    id: "authModeTab_login"
- tapOn:
    id: "emailInput"
- eraseText: 100
- inputText: "wrong.parent@example.com"
- hideKeyboard
- tapOn:
    id: "passwordInputToggle"
- tapOn:
    id: "passwordInput"
- eraseText: 100
- inputText: "WrongPass1"
- pressKey: ENTER
- tapOn:
    id: "submitButton"
- extendedWaitUntil:
    visible: "Save Password?"
    timeout: 30000
- tapOn: "Not Now"
- extendedWaitUntil:
    visible:
      id: "authErrorScreen"
    timeout: 30000
- assertVisible:
    id: "authErrorTitle"
- assertVisible:
    id: "retryAuthButton"
- takeScreenshot: output/maestro/nest-spine/02-auth-error
- tapOn:
    id: "recoverPasswordButton"
- extendedWaitUntil:
    visible:
      id: "forgotPasswordScreen"
    timeout: 30000
- assertVisible:
    id: "forgotPasswordTitle"
- takeScreenshot: output/maestro/nest-spine/03-forgot-password
