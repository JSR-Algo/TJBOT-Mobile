appId: net.jasonle.tjbot
name: Nest spine — login → onboarding → Home → lesson done
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      microphone: allow
      notifications: allow
- extendedWaitUntil:
    visible:
      id: "appRoot"
    timeout: 60000

# COPPA age band
- runFlow:
    when:
      visible:
        id: "ageBandOption_18_PLUS"
    commands:
      - tapOn:
          id: "ageBandOption_18_PLUS"
      - tapOn:
          id: "ageScreenContinueButton"

# Welcome
- extendedWaitUntil:
    visible:
      id: "getStartedButton"
    timeout: 45000
- tapOn:
    id: "getStartedButton"
- runFlow:
    when:
      visible:
        id: "getStartedButton"
    commands:
      - tapOn:
          id: "getStartedButton"

# Intro + Trust
- extendedWaitUntil:
    visible:
      id: "introNextButton"
    timeout: 45000
- repeat:
    times: 6
    commands:
      - runFlow:
          when:
            visible:
              id: "introNextButton"
          commands:
            - tapOn:
                id: "introNextButton"
      - runFlow:
          when:
            visible:
              id: "trustContinueButton"
          commands:
            - tapOn:
                id: "trustContinueButton"

- extendedWaitUntil:
    visible:
      id: "loginScreenScroll"
    timeout: 45000

# Login (pre-seeded Nest account) — use plain visible password field
- runFlow:
    when:
      visible:
        id: "authModeTab_login"
    commands:
      - tapOn:
          id: "authModeTab_login"
- tapOn:
    id: "emailInput"
- eraseText
- inputText: "maestro.login.1784299834@example.com"
- tapOn:
    id: "passwordInputToggle"
- tapOn:
    id: "passwordInput"
- eraseText
# Enter password in two chunks so iOS secure TextInput accepts it
- inputText: "TestPass"
- inputText: "123!"
- hideKeyboard
- tapOn:
    id: "submitButton"

# Parent consent (new account always needs it)
- extendedWaitUntil:
    visible:
      id: "parentConsentNameInput"
    timeout: 90000
- takeScreenshot: output/maestro/nest-spine/10-consent
- tapOn:
    id: "parentConsentNameInput"
- eraseText
- inputText: "Maestro Parent"
- tapOn:
    id: "parentConsentCheckbox"
- hideKeyboard
- tapOn:
    id: "parentConsentSubmitButton"

# Child profile
- extendedWaitUntil:
    visible:
      id: "childAgeBand_PRE_K"
    timeout: 45000
- takeScreenshot: output/maestro/nest-spine/11-child
- tapOn:
    id: "childAgeBand_PRE_K"
- tapOn:
    id: "childProfileSaveButton"

# Mic ask
- extendedWaitUntil:
    visible:
      id: "micAskContinueButton"
    timeout: 45000
- takeScreenshot: output/maestro/nest-spine/12-mic
- tapOn:
    id: "micAskContinueButton"

# First lesson → HomeHub
- extendedWaitUntil:
    visible:
      id: "firstLessonStartCta"
    timeout: 45000
- takeScreenshot: output/maestro/nest-spine/13-first-lesson
- tapOn:
    id: "firstLessonStartCta"

# HomeHub
- extendedWaitUntil:
    visible:
      id: "homePrimaryCta"
    timeout: 60000
- takeScreenshot: output/maestro/nest-spine/14-home
- tapOn:
    id: "homePrimaryCta"

# Lesson ready → Nest complete
- extendedWaitUntil:
    visible:
      id: "lessonReadyCta"
    timeout: 60000
- takeScreenshot: output/maestro/nest-spine/15-lesson-ready
- tapOn:
    id: "lessonReadyCta"

# Lesson done
- extendedWaitUntil:
    visible:
      id: "lessonDoneHomeButton"
    timeout: 60000
- takeScreenshot: output/maestro/nest-spine/16-lesson-done
- tapOn:
    id: "lessonDoneHomeButton"

# Back on Home
- extendedWaitUntil:
    visible:
      id: "homePrimaryCta"
    timeout: 45000
- takeScreenshot: output/maestro/nest-spine/17-home-after-lesson
