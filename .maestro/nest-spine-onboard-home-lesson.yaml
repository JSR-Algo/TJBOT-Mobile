appId: net.jasonle.tjbot
name: Nest spine — signup → onboarding → Home → lesson done
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      microphone: allow
      notifications: allow
- extendedWaitUntil:
    visible:
      id: "appRoot"
    timeout: 60000

# COPPA age band
- runFlow:
    when:
      visible:
        id: "ageBandOption_18_PLUS"
    commands:
      - tapOn:
          id: "ageBandOption_18_PLUS"
      - tapOn:
          id: "ageScreenContinueButton"

# Welcome
- extendedWaitUntil:
    visible:
      id: "getStartedButton"
    timeout: 45000
- tapOn:
    id: "getStartedButton"
- runFlow:
    when:
      visible:
        id: "getStartedButton"
    commands:
      - tapOn:
          id: "getStartedButton"

# Intro + Trust
- extendedWaitUntil:
    visible:
      id: "introNextButton"
    timeout: 45000
- repeat:
    times: 6
    commands:
      - runFlow:
          when:
            visible:
              id: "introNextButton"
          commands:
            - tapOn:
                id: "introNextButton"
      - runFlow:
          when:
            visible:
              id: "trustContinueButton"
          commands:
            - tapOn:
                id: "trustContinueButton"

- extendedWaitUntil:
    visible:
      id: "loginScreenScroll"
    timeout: 45000

# Signup with a unique Nest account so every run exercises onboarding.
- runFlow:
    when:
      visible:
        id: "authModeTab_signup"
    commands:
      - tapOn:
          id: "authModeTab_signup"
- tapOn:
    id: "emailInput"
- eraseText
- inputText: "${MAESTRO_TEST_EMAIL}"
- tapOn:
    id: "passwordInputToggle"
- tapOn:
    id: "passwordInput"
# The iOS 26 Strong Password sheet exposes no accessibility selector. This
# point is the sheet's close control on the single iPhone 17 test device.
- tapOn:
    point: "91%,58%"
- eraseText
- inputText: "TestPass123!"
- extendedWaitUntil:
    visible:
      id: "passwordRule_length_met"
    timeout: 15000
- runFlow:
    when:
      visible:
        id: "confirmPasswordInput"
    commands:
      - tapOn:
          id: "confirmPasswordInput"
      - eraseText
      - inputText: "TestPass123!"
- hideKeyboard
- tapOn:
    id: "submitButton"

# iOS may show the Password AutoFill save sheet immediately after auth or
# defer it until the next text field receives input. Dismiss either timing.
- tapOn:
    text: "Not Now"
    optional: true

# Parent consent (new account always needs it)
- extendedWaitUntil:
    visible:
      id: "parentConsentNameInput"
    timeout: 90000
- takeScreenshot: output/maestro/nest-spine/10-consent
- tapOn:
    id: "parentConsentNameInput"
- eraseText
- inputText: "Maestro Parent"
- tapOn:
    text: "Not Now"
    optional: true
- hideKeyboard
- tapOn:
    id: "parentConsentCheckbox"
- tapOn:
    id: "parentConsentSubmitButton"

# Child profile
- extendedWaitUntil:
    visible:
      id: "childAgeBand_PRE_K"
    timeout: 45000
- takeScreenshot: output/maestro/nest-spine/11-child
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "childAgeBand_PRE_K"
    retryTapIfNoChange: true
- assertVisible:
    id: "childAgeBand_PRE_K"
    selected: true
- scrollUntilVisible:
    element:
      id: "childProfileSaveButton"
    direction: DOWN
- tapOn:
    id: "childProfileSaveButton"
    retryTapIfNoChange: true

# Mic ask
- extendedWaitUntil:
    visible:
      id: "micAskContinueButton"
    timeout: 45000
- takeScreenshot: output/maestro/nest-spine/12-mic
- tapOn:
    id: "micAskContinueButton"

# First lesson → HomeHub
- extendedWaitUntil:
    visible:
      id: "firstLessonStartCta"
    timeout: 45000
- takeScreenshot: output/maestro/nest-spine/13-first-lesson
- tapOn:
    id: "firstLessonStartCta"

# HomeHub
- extendedWaitUntil:
    visible:
      id: "homePrimaryCta"
    timeout: 60000
- takeScreenshot: output/maestro/nest-spine/14-home
- tapOn:
    id: "homePrimaryCta"

# Lesson ready → Nest complete
- extendedWaitUntil:
    visible:
      id: "lessonReadyCta"
    timeout: 60000
- takeScreenshot: output/maestro/nest-spine/15-lesson-ready
- tapOn:
    id: "lessonReadyCta"

# Lesson done
- extendedWaitUntil:
    visible:
      id: "lessonDoneHomeButton"
    timeout: 60000
- takeScreenshot: output/maestro/nest-spine/16-lesson-done
- tapOn:
    id: "lessonDoneHomeButton"

# Back on Home
- extendedWaitUntil:
    visible:
      id: "homePrimaryCta"
    timeout: 45000
- takeScreenshot: output/maestro/nest-spine/17-home-after-lesson
