appId: net.jasonle.tjbot
name: Nest spine — signup → onboarding → Home → library
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      microphone: allow
      notifications: allow
- extendedWaitUntil:
    visible:
      id: "appRoot"
    timeout: 60000

# COPPA age band
- runFlow:
    when:
      visible:
        id: "ageBandOption_18_PLUS"
    commands:
      - tapOn:
          id: "ageBandOption_18_PLUS"
      - tapOn:
          id: "ageScreenContinueButton"

# Welcome
- extendedWaitUntil:
    visible:
      id: "getStartedButton"
    timeout: 45000
- tapOn:
    id: "getStartedButton"
- runFlow:
    when:
      visible:
        id: "getStartedButton"
    commands:
      - tapOn:
          id: "getStartedButton"

# Intro + Trust
- extendedWaitUntil:
    visible:
      id: "introNextButton"
    timeout: 45000
- repeat:
    times: 6
    commands:
      - runFlow:
          when:
            visible:
              id: "introNextButton"
          commands:
            - tapOn:
                id: "introNextButton"
      - runFlow:
          when:
            visible:
              id: "trustContinueButton"
          commands:
            - tapOn:
                id: "trustContinueButton"

# The privacy/trust page is taller than the iPhone 17 viewport. Its CTA is
# intentionally below the cards, so reveal it before waiting for auth.
- runFlow:
    when:
      visible: ".*(PRIVACY & SAFETY|QUYỀN RIÊNG TƯ & AN TOÀN).*"
    commands:
      - scrollUntilVisible:
          element:
            id: "trustContinueButton"
          direction: DOWN
      - tapOn:
          id: "trustContinueButton"

- extendedWaitUntil:
    visible:
      id: "loginScreenScroll"
    timeout: 45000

# Signup with a unique Nest account so every run exercises onboarding.
- runFlow:
    when:
      visible:
        id: "authModeTab_signup"
    commands:
      - tapOn:
          id: "authModeTab_signup"
- extendedWaitUntil:
    visible:
      id: "parentNameInput"
    timeout: 15000
- tapOn:
    id: "parentNameInput"
- eraseText
- inputText: "Maestro Parent"
- pressKey: ENTER
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "emailInput"
- eraseText
- inputText: "${MAESTRO_TEST_EMAIL}"
- pressKey: ENTER
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "passwordInput"
    direction: DOWN
- tapOn:
    id: "passwordInputToggle"
- tapOn:
    id: "passwordInput"
- eraseText
- inputText: "TestPass123!"
- extendedWaitUntil:
    visible:
      id: "passwordRule_length_met"
    timeout: 15000
- pressKey: ENTER
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "submitButton"
    direction: DOWN
- tapOn:
    id: "submitButton"

# iOS may show the Password AutoFill save sheet immediately after auth or
# defer it until the next text field receives input. Dismiss either timing.
- tapOn:
    text: "Not Now"
    optional: true

# Parent consent (new account always needs it)
- extendedWaitUntil:
    visible:
      id: "parentConsentNameInput"
    timeout: 90000
- takeScreenshot: output/maestro/nest-spine/10-consent
- tapOn:
    id: "parentConsentNameInput"
- eraseText
- inputText: "Maestro Parent"
- tapOn:
    text: "Not Now"
    optional: true
- pressKey: ENTER
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "parentConsentCheckbox"
    direction: DOWN
- tapOn:
    id: "parentConsentCheckbox"
- scrollUntilVisible:
    element:
      id: "parentConsentSubmitButton"
    direction: DOWN
- tapOn:
    id: "parentConsentSubmitButton"

# Child profile
- extendedWaitUntil:
    visible:
      id: "childNameInput"
    timeout: 45000
- takeScreenshot: output/maestro/nest-spine/11-child
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "childNameInput"
- eraseText
- inputText: "Maestro Kid"
- pressKey: ENTER
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "childAgeBand_PRE_K"
    retryTapIfNoChange: true
- assertVisible:
    id: "childAgeBand_PRE_K"
    selected: true
- scrollUntilVisible:
    element:
      id: "childProfileSaveButton"
    direction: DOWN
- tapOn:
    id: "childProfileSaveButton"
    retryTapIfNoChange: true

# Mic ask
- extendedWaitUntil:
    visible:
      id: "micAskContinueButton"
    timeout: 45000
- takeScreenshot: output/maestro/nest-spine/12-mic
- tapOn:
    id: "micAskContinueButton"

# First lesson → HomeHub
- extendedWaitUntil:
    visible: ".*(Your first lesson is ready|Bài học đầu tiên).*"
    timeout: 45000
- scrollUntilVisible:
    element:
      id: "firstLessonStartCta"
    direction: DOWN
- takeScreenshot: output/maestro/nest-spine/13-first-lesson
- tapOn:
    id: "firstLessonStartCta"

# Robot-first: the first-lesson CTA completes onboarding and lands on HomeHub.
# The phone lesson player is intentionally hidden (lessons run on the TeeBot).
- extendedWaitUntil:
    visible:
      id: "home(PrimaryCta|EmptyCard|EmptyCta)"
    timeout: 60000
- takeScreenshot: output/maestro/nest-spine/15-home

# Open the real backend-backed library from the authenticated tab bar.
- tapOn:
    id: "libraryTab"
- extendedWaitUntil:
    visible:
      id: "courseLibraryPage"
    timeout: 60000
- assertVisible: ".*(This Is a Barn|Barnyard Basics|Color Safari|Number Train).*"
- takeScreenshot: output/maestro/nest-spine/16-library
