appId: net.jasonle.tjbot
name: Nest spine — signup through HomeHub (local Nest)
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      microphone: allow
      notifications: allow
- extendedWaitUntil:
    visible:
      id: "appRoot"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: "ageBandOption_18_PLUS"
    commands:
      - tapOn:
          id: "ageBandOption_18_PLUS"
      - tapOn:
          id: "ageScreenContinueButton"
- extendedWaitUntil:
    visible:
      id: "getStartedButton"
    timeout: 45000
- tapOn:
    id: "getStartedButton"
- runFlow:
    when:
      visible:
        id: "getStartedButton"
    commands:
      - tapOn:
          id: "getStartedButton"
- extendedWaitUntil:
    visible:
      id: "introNextButton"
    timeout: 45000
- repeat:
    times: 6
    commands:
      - runFlow:
          when:
            visible:
              id: "introNextButton"
          commands:
            - tapOn:
                id: "introNextButton"
- runFlow:
    when:
      visible:
        id: "trustContinueButton"
    commands:
      - tapOn:
          id: "trustContinueButton"
- runFlow:
    when:
      visible:
        id: "trustScreen"
    commands:
      - scrollUntilVisible:
          element:
            id: "trustContinueButton"
          direction: DOWN
      - tapOn:
          id: "trustContinueButton"
- extendedWaitUntil:
    visible:
      id: "loginScreenScroll"
    timeout: 45000
- runFlow:
    when:
      visible:
        id: "authModeTab_signup"
    commands:
      - tapOn:
          id: "authModeTab_signup"
- runFlow:
    when:
      visible:
        id: "parentNameInput"
    commands:
      - tapOn:
          id: "parentNameInput"
      - inputText: "Maestro Parent"
      - hideKeyboard
- tapOn:
    id: "emailInput"
- eraseText
- inputText: "maestro.home.1785405424@example.com"
- hideKeyboard
- tapOn:
    id: "passwordInput"
- eraseText
- inputText: "TestPass123!"
- extendedWaitUntil:
    visible:
      id: "passwordRule_length_met"
    timeout: 15000
# iOS keyboard covers the CTA; dismiss via return key before submit
- pressKey: Enter
- tapOn:
    id: "submitButton"
# iOS Password AutoFill sheet appears after successful signup
- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible:
      id: "parentConsentNameInput"
    timeout: 60000
- tapOn:
    id: "parentConsentNameInput"
- eraseText
- inputText: "Home Parent"
- hideKeyboard
- tapOn:
    id: "parentConsentCheckbox"
- tapOn:
    id: "parentConsentSubmitButton"
- extendedWaitUntil:
    visible:
      id: "childAgeBand_PRE_K"
    timeout: 45000
- tapOn:
    id: "childNameInput"
- inputText: "Maestro Kid"
- hideKeyboard
- tapOn:
    id: "childAgeBand_PRE_K"
- tapOn:
    id: "childProfileSaveButton"
- extendedWaitUntil:
    visible:
      id: "micAskContinueButton"
    timeout: 45000
- tapOn:
    id: "micAskContinueButton"
- scrollUntilVisible:
    element:
      id: "firstLessonStartCta"
    direction: DOWN
    timeout: 45000
- tapOn:
    id: "firstLessonStartCta"
- extendedWaitUntil:
    visible:
      id: "home(PrimaryCta|EmptyCard|EmptyCta)"
    timeout: 60000
- takeScreenshot: output/maestro/nest-spine/03-home
- assertVisible:
    id: "home(PrimaryCta|EmptyCard|EmptyCta)"
