appId: net.jasonle.tjbot
name: Nest spine — signup after age+intro (local Nest)
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "appRoot"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: "ageBandOption_18_PLUS"
    commands:
      - tapOn:
          id: "ageBandOption_18_PLUS"
      - tapOn:
          id: "ageScreenContinueButton"
- runFlow:
    when:
      visible:
        id: "getStartedButton"
    commands:
      - tapOn:
          id: "getStartedButton"
- repeat:
    times: 6
    commands:
      - runFlow:
          when:
            visible:
              id: "introNextButton"
          commands:
            - tapOn:
                id: "introNextButton"
      - runFlow:
          when:
            visible:
              id: "trustContinueButton"
          commands:
            - tapOn:
                id: "trustContinueButton"
- extendedWaitUntil:
    visible:
      id: "loginScreenScroll"
    timeout: 45000
- runFlow:
    when:
      visible:
        id: "authModeTab_signup"
    commands:
      - tapOn:
          id: "authModeTab_signup"
- tapOn:
    id: "emailInput"
- eraseText
- inputText: "maestro.nest@example.com"
- tapOn:
    id: "passwordInput"
- eraseText
- inputText: "TestPass123!"
- runFlow:
    when:
      visible:
        id: "confirmPasswordInput"
    commands:
      - tapOn:
          id: "confirmPasswordInput"
      - eraseText
      - inputText: "TestPass123!"
- tapOn:
    id: "submitButton"
- takeScreenshot: output/maestro/nest-spine/02-after-submit
# Consent screen or next onboarding if Nest accepts signup
- extendedWaitUntil:
    visible:
      id: "appRoot"
    timeout: 60000
- takeScreenshot: output/maestro/nest-spine/03-post-auth
