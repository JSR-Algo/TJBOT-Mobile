appId: net.jasonle.tjbot
name: Next five MVP screens and breadcrumb chain
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "appRoot"
    timeout: 60000

- openLink: "tjbot://course-library/course-library"
- extendedWaitUntil:
    visible:
      id: "courseLibraryPage"
    timeout: 45000
- runFlow:
    when:
      visible: ".*(Switch to English|Chuyển sang tiếng Anh).*"
    commands:
      - tapOn:
          id: "appShellLanguage"
- runFlow:
    when:
      visible: ".*Open debugger to view warnings.*"
    commands:
      - tapOn:
          point: "92%,93%"
- tapOn:
    id: "featuredCourseCard"
- extendedWaitUntil:
    visible:
      id: "courseDetailPage"
    timeout: 30000
- tapOn:
    id: "courseStage-1"

# 14 — Lesson detail
- extendedWaitUntil:
    visible:
      id: "lessonDetailPage"
    timeout: 30000
- assertVisible:
    id: "lessonDetailBreadcrumb"
- assertVisible: ".*(Course map|Bản đồ khóa học|Lesson detail|Chi tiết bài học).*"
- assertNotVisible:
    id: "sendLessonToRobot"
- takeScreenshot: "/tmp/teebot-next-five/14-lesson-detail"

# 21 — Robot hub (the right-sized one-Robot MVP version of fleet)
- waitForAnimationToEnd
- runFlow:
    when:
      visible: ".*Open debugger to view warnings.*"
    commands:
      - tapOn:
          point: "92%,93%"
- tapOn:
    id: "devicesTab"
- extendedWaitUntil:
    visible:
      id: "robotHubPage"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "openRobotDetail"
    timeout: 30000
- takeScreenshot: "/tmp/teebot-next-five/21-robot-hub"
- scrollUntilVisible:
    element: ".*(Unpair this Robot|Hủy ghép nối Robot).*"
    direction: DOWN
- takeScreenshot: "/tmp/teebot-next-five/21-robot-hub-tools"
- scrollUntilVisible:
    element:
      id: "openRobotDetail"
    direction: UP
- tapOn:
    id: "openRobotDetail"

# 22 — Robot detail
- extendedWaitUntil:
    visible:
      id: "deviceOverviewScroll"
    timeout: 30000
- assertVisible:
    id: "robotDetailBreadcrumb"
- takeScreenshot: "/tmp/teebot-next-five/22-robot-detail"

# 23 — Parent profile
- tapOn:
    id: "profileTab"
- extendedWaitUntil:
    visible:
      id: "parentProfileCard"
    timeout: 30000
- assertVisible: ".*(Safety & Limits|An toàn & giới hạn).*"
- takeScreenshot: "/tmp/teebot-next-five/23-parent-profile"
