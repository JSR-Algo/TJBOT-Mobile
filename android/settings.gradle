pluginManagement {
    includeBuild("../node_modules/@react-native/gradle-plugin")
    includeBuild("../node_modules/expo-modules-core/expo-module-gradle-plugin")
    includeBuild("../node_modules/expo-modules-autolinking/android/expo-gradle-plugin")
    repositories {
        google()
        mavenCentral()
    }
}
plugins {
    id("com.facebook.react.settings")
    id("expo-autolinking-settings")
}
dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
}
expoAutolinking.useExpoModules()
expoAutolinking.useExpoVersionCatalog()
rootProject.name = 'TJBotMobile'
include ':app'
include ':react-native-ble-plx'
project(':react-native-ble-plx').projectDir = new File(rootProject.projectDir, '../node_modules/react-native-ble-plx/android')
include ':react-native-svg'
project(':react-native-svg').projectDir = new File(rootProject.projectDir, '../node_modules/react-native-svg/android')
includeBuild(expoAutolinking.reactNativeGradlePlugin)
