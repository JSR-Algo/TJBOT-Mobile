<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 400 240" role="img" aria-label="Happy">
  <title>Happy</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#10183A"/><stop offset="100%" stop-color="#05081C"/>
    </radialGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8FBFF"/><stop offset="60%" stop-color="#4DD0E1"/><stop offset="100%" stop-color="#1FA9C2"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <g filter="url(#glow)">
    <path d="M100 140 L180 140 Q180 90 140 90 Q100 90 100 140 Z" fill="url(#eye)"/>
    <path d="M220 140 L300 140 Q300 90 260 90 Q220 90 220 140 Z" fill="url(#eye)"/>
  </g>
  <ellipse cx="124" cy="106" rx="14" ry="9" fill="#FFFFFF" opacity="0.7"/>
  <ellipse cx="244" cy="106" rx="14" ry="9" fill="#FFFFFF" opacity="0.7"/>
  <path d="M158 178 Q200 200 242 178" stroke="#4DD0E1" stroke-width="6" stroke-linecap="round" fill="none" filter="url(#glow)" opacity="0.85"/>
</svg>
