<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 400 240" role="img" aria-label="Sleepy">
  <title>Sleepy</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#10183A"/><stop offset="100%" stop-color="#05081C"/>
    </radialGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8FBFF"/><stop offset="60%" stop-color="#4DD0E1"/><stop offset="100%" stop-color="#1FA9C2"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <g filter="url(#glow)">
    <path d="M100 130 Q100 100 140 100 L180 100 Q180 100 180 130 Z" fill="url(#eye)"/>
    <path d="M220 130 Q220 100 260 100 L300 100 Q300 100 300 130 Z" fill="url(#eye)"/>
  </g>
  <g fill="#A0AEC0" font-family="Helvetica,Arial,sans-serif" font-weight="700">
    <text x="320" y="80" font-size="28">z</text>
    <text x="346" y="56" font-size="22">z</text>
    <text x="368" y="38" font-size="16">z</text>
  </g>
</svg>
