  <g filter="url(#glow)">
    <path d="M118 178 Q108 200 116 214 Q128 216 130 200 Z" fill="url(#tear)"/>
  </g>
  <ellipse cx="120" cy="190" rx="3" ry="5" fill="#FFFFFF" opacity="0.85"/>
