<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 400 240" role="img" aria-label="Confused">
  <title>Confused</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#10183A"/><stop offset="100%" stop-color="#05081C"/>
    </radialGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8FBFF"/><stop offset="60%" stop-color="#4DD0E1"/><stop offset="100%" stop-color="#1FA9C2"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <g filter="url(#glow)">
    <rect x="100" y="84" width="80" height="80" rx="24" fill="url(#eye)"/>
    <rect x="220" y="60" width="80" height="120" rx="28" fill="url(#eye)"/>
  </g>
  <rect x="112" y="96" width="20" height="14" rx="7" fill="#FFFFFF" opacity="0.7"/>
  <rect x="232" y="74" width="22" height="18" rx="9" fill="#FFFFFF" opacity="0.7"/>
  <g fill="#FFEB3B" font-family="Helvetica,Arial,sans-serif" font-weight="800" filter="url(#glow)">
    <text x="56" y="80" font-size="40">?</text>
    <text x="332" y="200" font-size="32">?</text>
  </g>
</svg>
