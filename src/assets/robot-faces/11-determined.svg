<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 400 240" role="img" aria-label="Determined">
  <title>Determined</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#10183A"/><stop offset="100%" stop-color="#05081C"/>
    </radialGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8FBFF"/><stop offset="60%" stop-color="#4DD0E1"/><stop offset="100%" stop-color="#1FA9C2"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <g filter="url(#glow)">
    <path d="M100 100 L180 78 L180 170 L100 170 Z" fill="url(#eye)" rx="10"/>
    <path d="M220 78 L300 100 L300 170 L220 170 Z" fill="url(#eye)"/>
  </g>
  <rect x="112" y="110" width="22" height="16" rx="8" fill="#FFFFFF" opacity="0.7"/>
  <rect x="240" y="110" width="22" height="16" rx="8" fill="#FFFFFF" opacity="0.7"/>
  <g stroke="#FFEB3B" stroke-width="6" stroke-linecap="round" filter="url(#glow)">
    <line x1="80" y1="60" x2="120" y2="78"/>
    <line x1="280" y1="78" x2="320" y2="60"/>
  </g>
</svg>
