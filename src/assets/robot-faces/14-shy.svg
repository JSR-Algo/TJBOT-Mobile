<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 400 240" role="img" aria-label="Shy">
  <title>Shy</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#10183A"/><stop offset="100%" stop-color="#05081C"/>
    </radialGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8FBFF"/><stop offset="60%" stop-color="#4DD0E1"/><stop offset="100%" stop-color="#1FA9C2"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8FB8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FF8FB8" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <g filter="url(#glow)">
    <path d="M100 130 Q100 105 140 105 L180 105 Q180 105 180 130 Z" fill="url(#eye)"/>
    <path d="M220 130 Q220 105 260 105 L300 105 Q300 105 300 130 Z" fill="url(#eye)"/>
  </g>
  <ellipse cx="80" cy="160" rx="36" ry="20" fill="url(#blush)"/>
  <ellipse cx="320" cy="160" rx="36" ry="20" fill="url(#blush)"/>
</svg>
