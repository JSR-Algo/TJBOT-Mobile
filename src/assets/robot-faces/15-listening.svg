<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 400 240" role="img" aria-label="Listening">
  <title>Listening</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#10183A"/><stop offset="100%" stop-color="#05081C"/>
    </radialGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8FBFF"/><stop offset="60%" stop-color="#4DD0E1"/><stop offset="100%" stop-color="#1FA9C2"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <g fill="none" stroke="#4DD0E1" stroke-width="2" opacity="0.6">
    <circle cx="200" cy="120" r="80"/>
    <circle cx="200" cy="120" r="105" opacity="0.4"/>
    <circle cx="200" cy="120" r="130" opacity="0.2"/>
  </g>
  <g filter="url(#glow)">
    <rect x="100" y="74" width="80" height="92" rx="24" fill="url(#eye)"/>
    <rect x="220" y="74" width="80" height="92" rx="24" fill="url(#eye)"/>
  </g>
  <rect x="116" y="86" width="22" height="18" rx="9" fill="#FFFFFF" opacity="0.7"/>
  <rect x="236" y="86" width="22" height="18" rx="9" fill="#FFFFFF" opacity="0.7"/>
</svg>
