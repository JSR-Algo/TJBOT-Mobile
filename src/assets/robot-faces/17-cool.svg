<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 400 240" role="img" aria-label="Cool">
  <title>Cool</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#10183A"/><stop offset="100%" stop-color="#05081C"/>
    </radialGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A2540"/>
      <stop offset="50%" stop-color="#0A0E27"/>
      <stop offset="100%" stop-color="#1A2540"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A8FBFF" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#A8FBFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <rect x="60" y="100" width="280" height="14" rx="2" fill="#1A2540"/>
  <g stroke="#0A0E27" stroke-width="3">
    <rect x="80" y="78" width="120" height="80" rx="14" fill="url(#lens)"/>
    <rect x="200" y="78" width="120" height="80" rx="14" fill="url(#lens)"/>
  </g>
  <rect x="80" y="78" width="120" height="80" rx="14" fill="url(#shine)"/>
  <rect x="200" y="78" width="120" height="80" rx="14" fill="url(#shine)"/>
  <g filter="url(#glow)" opacity="0.55">
    <rect x="92" y="92" width="32" height="14" rx="6" fill="#A8FBFF"/>
    <rect x="212" y="92" width="32" height="14" rx="6" fill="#A8FBFF"/>
  </g>
  <path d="M150 188 Q200 208 250 188" stroke="#4DD0E1" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#glow)"/>
</svg>
