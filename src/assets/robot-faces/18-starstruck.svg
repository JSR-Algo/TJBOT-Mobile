<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 400 240" role="img" aria-label="Star-struck">
  <title>Star-struck</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#10183A"/><stop offset="100%" stop-color="#05081C"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF7B2"/><stop offset="60%" stop-color="#FFEB3B"/><stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <g filter="url(#glow)">
    <path d="M140 56 L160 108 L216 112 L172 148 L188 204 L140 174 L92 204 L108 148 L64 112 L120 108 Z" fill="url(#star)"/>
    <path d="M260 56 L280 108 L336 112 L292 148 L308 204 L260 174 L212 204 L228 148 L184 112 L240 108 Z" fill="url(#star)"/>
  </g>
