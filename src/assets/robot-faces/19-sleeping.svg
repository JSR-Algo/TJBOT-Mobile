<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 400 240" role="img" aria-label="Sleeping">
  <title>Sleeping</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#10183A"/><stop offset="100%" stop-color="#05081C"/>
    </radialGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8FBFF"/><stop offset="60%" stop-color="#4DD0E1"/><stop offset="100%" stop-color="#1FA9C2"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <g fill="none" stroke="url(#eye)" stroke-width="14" stroke-linecap="round" filter="url(#glow)">
    <path d="M100 130 Q140 150 180 130"/>
    <path d="M220 130 Q260 150 300 130"/>
  </g>
  <g fill="#7BA8FF" font-family="Helvetica,Arial,sans-serif" font-weight="800" filter="url(#glow)">
    <text x="306" y="92" font-size="36">z</text>
    <text x="338" y="60" font-size="28">z</text>
    <text x="364" y="36" font-size="20">z</text>
  </g>
</svg>
