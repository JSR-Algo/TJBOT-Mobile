<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Teo LCD Face</title>
  <style>
    :root {
      --face-bg: #03051a;
      --screen-bg: #061423;
      --panel: #092b3a;
      --panel-deep: #04111f;
      --accent: #65f3f8;
      --accent-2: #a8fbff;
      --warn: #ffd166;
      --danger: #ff5555;
      --ink: #e8f5ff;
      --muted: #7f8da8;
      --chrome: #071028;
      --chrome-hi: #18284a;
      --line: rgba(168, 251, 255, 0.16);
      --shadow: rgba(0, 8, 30, 0.68);
      color-scheme: dark;
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #02040d; color: var(--ink); }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      padding: clamp(14px, 3vw, 30px);
      background:
        radial-gradient(800px 460px at 50% 35%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 65%),
        radial-gradient(700px 480px at 15% 0%, #102046, transparent 60%),
        linear-gradient(180deg, #02040d, var(--face-bg));
    }

    body[data-kiosk="true"] {
      padding: 0;
      background: #000;
      cursor: none;
    }

    .stage {
      width: min(100vw - 28px, 1120px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 260px;
      gap: 18px;
      align-items: start;
    }

    body[data-kiosk="true"] .stage {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    .lcd-shell {
      aspect-ratio: 5 / 3;
      width: 100%;
      min-height: 0;
      position: relative;
      border-radius: clamp(18px, 4vw, 46px);
      background:
        linear-gradient(135deg, #172648, #030817 44%, #0b1431 70%, #1a3155);
      padding: clamp(12px, 2.8vw, 32px);
      box-shadow:
        inset 0 2px 1px rgba(255,255,255,0.08),
        inset 0 -8px 26px rgba(0,0,0,0.75),
        0 22px 70px var(--shadow);
      overflow: hidden;
    }

    body[data-kiosk="true"] .lcd-shell {
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      padding: 0;
      box-shadow: none;
      background: #000;
    }

    .side-port {
      position: absolute;
      top: 43%;
      width: 5.8%;
      height: 21%;
      background: linear-gradient(90deg, #020714, #102341 50%, #020714);
      border: 1px solid rgba(168,251,255,0.10);
      box-shadow: inset 0 0 18px rgba(0,0,0,0.65);
    }
    .side-port.left { left: -2.6%; border-radius: 18px 6px 6px 18px; }
    .side-port.right { right: -2.6%; border-radius: 6px 18px 18px 6px; }

    body[data-kiosk="true"] .side-port { display: none; }

    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: clamp(16px, 3.2vw, 36px);
      overflow: hidden;
      background:
        radial-gradient(420px 240px at 50% 48%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 62%),
        radial-gradient(580px 320px at 50% 62%, color-mix(in srgb, var(--panel) 80%, #000), #02060e 78%);
      border: 1px solid rgba(168,251,255,0.16);
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,0.035),
        inset 0 0 64px rgba(0,0,0,0.72);
    }

    body[data-kiosk="true"] .screen {
      border-radius: 0;
      border: 0;
      background:
        radial-gradient(420px 240px at 50% 48%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 62%),
        radial-gradient(760px 440px at 50% 60%, color-mix(in srgb, var(--panel) 72%, #000), #000 78%);
    }

    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(110deg, rgba(255,255,255,0.09), transparent 18% 82%, rgba(255,255,255,0.04)),
        repeating-linear-gradient(0deg, transparent 0 3px, rgba(168,251,255,0.025) 3px 4px);
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: 0.7;
      z-index: 5;
    }

    .face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      transform-origin: 50% 58%;
      animation: breathe 4s ease-in-out infinite;
    }

    .face-svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .eye {
      transform-box: fill-box;
      transform-origin: center;
      transition:
        transform 260ms cubic-bezier(.2,.9,.2,1),
        opacity 180ms ease,
        d 260ms ease;
      filter: drop-shadow(0 0 18px color-mix(in srgb, var(--accent) 72%, transparent));
    }

    .eye-core {
      fill: var(--accent);
    }

    .eye-highlight,
    .sparkle,
    .cheek,
    .mouth,
    .status-mark,
    .orbit {
      transition: opacity 220ms ease, transform 260ms ease, stroke 180ms ease, fill 180ms ease;
    }

    .eye-highlight {
      fill: #fff;
      opacity: 0.78;
    }

    .mouth {
      fill: none;
      stroke: var(--accent);
      stroke-width: 16;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 14px color-mix(in srgb, var(--accent) 68%, transparent));
    }

    .cheek {
      fill: color-mix(in srgb, var(--accent) 62%, #fff 38%);
      opacity: 0;
      filter: drop-shadow(0 0 14px color-mix(in srgb, var(--accent) 45%, transparent));
    }

    .sparkle {
      fill: var(--accent-2);
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      filter: drop-shadow(0 0 10px var(--accent-2));
    }

    .orbit {
      fill: none;
      stroke: var(--accent);
      stroke-width: 4;
      opacity: 0;
      transform-origin: 400px 240px;
    }

    .status-mark {
      opacity: 0;
      fill: none;
      stroke: var(--accent);
      stroke-width: 10;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 12px color-mix(in srgb, var(--accent) 70%, transparent));
    }

    .thinking-dot {
      fill: var(--accent);
      opacity: 0;
      filter: drop-shadow(0 0 10px var(--accent));
    }

    .controls {
      border: 1px solid var(--line);
      background: rgba(8, 15, 34, 0.86);
      border-radius: 18px;
      box-shadow: 0 16px 44px rgba(0,0,0,0.34);
      padding: 14px;
      position: sticky;
      top: 18px;
    }

    body[data-kiosk="true"] .controls { display: none; }

    .controls h1 {
      margin: 0 0 4px;
      font-size: 18px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .controls p {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .control-group {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .control-group span {
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
    }

    button {
      min-height: 34px;
      color: var(--ink);
      background: rgba(255,255,255,0.055);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 9px;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    button[aria-pressed="true"] {
      color: #001217;
      background: var(--accent);
      border-color: var(--accent-2);
      box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 45%, transparent);
      font-weight: 700;
    }

    .theme-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
    }

    .swatch {
      min-height: 34px;
      border-radius: 9px;
      padding: 0;
      font-size: 0;
    }

    .swatch[data-theme="teo"] { background: linear-gradient(135deg, #65f3f8, #092b3a); }
    .swatch[data-theme="pink"] { background: linear-gradient(135deg, #ff7ab8, #351328); }
    .swatch[data-theme="mint"] { background: linear-gradient(135deg, #72f2b4, #103527); }
    .swatch[data-theme="violet"] { background: linear-gradient(135deg, #a78bfa, #21153e); }
    .swatch[data-theme="amber"] { background: linear-gradient(135deg, #ffd166, #34270b); }

    body[data-state="idle"] .eye { animation: blink 5.6s infinite; }
    body[data-state="idle"] .mouth { d: path("M330 314 Q400 348 470 314"); }

    body[data-state="listening"] .face { animation: attentive 1.5s ease-in-out infinite; }
    body[data-state="listening"] .eye { transform: scale(1.08); }
    body[data-state="listening"] .mouth { d: path("M340 318 Q400 334 460 318"); }
    body[data-state="listening"] .orbit { opacity: 0.52; animation: pulse-ring 1.6s ease-out infinite; }
    body[data-state="listening"] .orbit.two { animation-delay: .45s; }
    body[data-state="listening"] .orbit.three { animation-delay: .9s; }

    body[data-state="thinking"] .eye { transform: scale(0.9) translateY(-6px); }
    body[data-state="thinking"] .mouth { opacity: 0.2; }
    body[data-state="thinking"] .thinking-dot { animation: think 1.2s ease-in-out infinite; }
    body[data-state="thinking"] .thinking-dot.d2 { animation-delay: .18s; }
    body[data-state="thinking"] .thinking-dot.d3 { animation-delay: .36s; }

    body[data-state="speaking"] .face { animation: speak-bob .55s ease-in-out infinite; }
    body[data-state="speaking"] .eye { transform: scaleY(1.04); }
    body[data-state="speaking"] .mouth { d: path("M342 308 Q400 346 458 308"); animation: talk .55s ease-in-out infinite; }

    body[data-state="happy"] .eye.left { transform: translateY(4px) scaleY(0.54) rotate(3deg); }
    body[data-state="happy"] .eye.right { transform: translateY(4px) scaleY(0.54) rotate(-3deg); }
    body[data-state="happy"] .mouth { d: path("M315 304 Q400 368 485 304"); }
    body[data-state="happy"] .cheek { opacity: .42; }
    body[data-state="happy"] .sparkle { opacity: .9; animation: twinkle 1.5s ease-in-out infinite; }

    body[data-state="curious"] .face { transform: rotate(-2deg); }
    body[data-state="curious"] .eye.left { transform: translateY(-8px) scale(1.08); }
    body[data-state="curious"] .eye.right { transform: translateY(9px) scale(.86); }
    body[data-state="curious"] .mouth { d: path("M368 324 Q400 340 432 324"); }
    body[data-state="curious"] .status-mark.question { opacity: .88; }

    body[data-state="confused"] .face { animation: wobble 1.4s ease-in-out infinite; }
    body[data-state="confused"] .eye.left { transform: rotate(-7deg) scaleY(.82); }
    body[data-state="confused"] .eye.right { transform: rotate(8deg) scaleY(1.1); }
    body[data-state="confused"] .mouth { d: path("M344 326 Q398 304 456 326"); opacity: .72; }
    body[data-state="confused"] .status-mark.question { opacity: .55; transform: translateX(-36px) translateY(-12px); }

    body[data-state="sleepy"] .face { animation: sleepy-sway 4.2s ease-in-out infinite; }
    body[data-state="sleepy"] .eye { transform: scaleY(.12) translateY(18px); }
    body[data-state="sleepy"] .eye-highlight { opacity: 0; }
    body[data-state="sleepy"] .mouth { d: path("M365 326 Q400 334 435 326"); opacity: .44; }
    body[data-state="sleepy"] .status-mark.zed { opacity: .75; animation: float-z 2.6s ease-in-out infinite; }

    body[data-state="reconnecting"] .face { animation: reconnect-shift 1.2s ease-in-out infinite; }
    body[data-state="reconnecting"] .eye { opacity: .72; transform: scaleX(.72); }
    body[data-state="reconnecting"] .mouth { d: path("M355 324 H445"); opacity: .58; }
    body[data-state="reconnecting"] .orbit { opacity: .36; animation: reconnect-ring 1.4s linear infinite; }

    body[data-state="error"] {
      --accent: var(--danger);
      --accent-2: #ffd0d0;
      --panel: #301017;
    }
    body[data-state="error"] .face { animation: error-shake .18s linear infinite; }
    body[data-state="error"] .eye { transform: scaleY(.58) rotate(-10deg); }
    body[data-state="error"] .eye.right { transform: scaleY(.58) rotate(10deg); }
    body[data-state="error"] .mouth { d: path("M345 334 Q400 304 455 334"); }
    body[data-state="error"] .status-mark.bang { opacity: .9; }

    @keyframes breathe {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.012) translateY(-2px); }
    }
    @keyframes attentive {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.018); }
    }
    @keyframes speak-bob {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-3px) scale(1.008); }
    }
    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(1); }
      94% { transform: scaleY(.08); }
      97% { transform: scaleY(1); }
    }
    @keyframes talk {
      0%, 100% { stroke-width: 14; transform: translateY(0); }
      50% { stroke-width: 24; transform: translateY(5px); }
    }
    @keyframes pulse-ring {
      0% { transform: scale(.55); opacity: .62; }
      100% { transform: scale(1.38); opacity: 0; }
    }
    @keyframes reconnect-ring {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -90; }
    }
    @keyframes think {
      0%, 100% { opacity: .2; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-16px); }
    }
    @keyframes twinkle {
      0%, 100% { transform: scale(.72) rotate(0deg); opacity: .35; }
      50% { transform: scale(1.08) rotate(18deg); opacity: 1; }
    }
    @keyframes wobble {
      0%, 100% { transform: rotate(-1deg); }
      50% { transform: rotate(1.5deg); }
    }
    @keyframes sleepy-sway {
      0%, 100% { transform: rotate(-1deg) translateY(0); }
      50% { transform: rotate(1deg) translateY(4px); }
    }
    @keyframes float-z {
      0%, 100% { transform: translateY(0); opacity: .35; }
      50% { transform: translateY(-18px); opacity: .9; }
    }
    @keyframes reconnect-shift {
      0%, 100% { transform: translateX(-2px); }
      50% { transform: translateX(2px); }
    }
    @keyframes error-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      75% { transform: translateX(3px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }

    @media (max-width: 820px) {
      .stage { grid-template-columns: 1fr; }
      .controls { position: static; }
    }
  </style>
</head>
<body data-state="idle" data-theme="teo">
  <main class="stage" aria-label="Teo LCD face preview">
    <section class="lcd-shell" aria-label="LCD face">
      <div class="side-port left"></div>
      <div class="side-port right"></div>
      <div class="screen">
        <div class="face" aria-hidden="true">
          <svg class="face-svg" viewBox="0 0 800 480" preserveAspectRatio="xMidYMid meet">
            <defs>
              <radialGradient id="eyeFalloff" cx="50%" cy="42%" r="68%">
                <stop offset="0%" stop-color="var(--accent-2)"/>
                <stop offset="62%" stop-color="var(--accent)"/>
                <stop offset="100%" stop-color="color-mix(in srgb, var(--accent) 72%, #002733)"/>
              </radialGradient>
              <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
                <feGaussianBlur stdDeviation="9" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>
            <ellipse cx="400" cy="250" rx="250" ry="130" fill="color-mix(in srgb, var(--accent) 7%, transparent)" filter="url(#softGlow)"/>
            <circle class="orbit one" cx="400" cy="240" r="130"/>
            <circle class="orbit two" cx="400" cy="240" r="170"/>
            <circle class="orbit three" cx="400" cy="240" r="210"/>

            <g filter="url(#softGlow)">
              <circle class="eye eye-core left" cx="285" cy="225" r="57"/>
              <circle class="eye eye-core right" cx="515" cy="225" r="57"/>
            </g>
            <circle class="eye-highlight left" cx="305" cy="204" r="13"/>
            <circle class="eye-highlight right" cx="535" cy="204" r="13"/>

            <path class="mouth" d="M330 314 Q400 348 470 314"/>

            <ellipse class="cheek" cx="212" cy="292" rx="34" ry="12"/>
            <ellipse class="cheek" cx="588" cy="292" rx="34" ry="12"/>

            <path class="sparkle s1" d="M185 145 L196 170 L222 181 L196 192 L185 218 L174 192 L148 181 L174 170 Z"/>
            <path class="sparkle s2" d="M620 122 L628 141 L648 149 L628 157 L620 176 L612 157 L592 149 L612 141 Z"/>
            <path class="sparkle s3" d="M578 330 L586 347 L604 354 L586 361 L578 378 L570 361 L552 354 L570 347 Z"/>

            <path class="status-mark question" d="M626 126 C652 102 688 114 688 146 C688 174 654 176 654 204 M654 236 H654"/>
            <path class="status-mark zed" d="M610 120 H668 L610 188 H668 M692 88 H736 L692 138 H736"/>
            <path class="status-mark bang" d="M640 106 V186 M640 228 H640"/>

            <circle class="thinking-dot d1" cx="356" cy="330" r="11"/>
            <circle class="thinking-dot d2" cx="400" cy="330" r="11"/>
            <circle class="thinking-dot d3" cx="444" cy="330" r="11"/>
          </svg>
        </div>
      </div>
    </section>

    <aside class="controls" aria-label="Face controls">
      <h1>Teo LCD Face</h1>
      <p>Animated vector face based on the selected glow-vector LCD direction. Use kiosk mode for the real screen.</p>

      <div class="control-group">
        <span>State</span>
        <div class="button-grid" id="stateControls"></div>
      </div>

      <div class="control-group">
        <span>Color</span>
        <div class="theme-grid" id="themeControls"></div>
      </div>
    </aside>
  </main>

  <script>
    const STATES = [
      "idle",
      "listening",
      "thinking",
      "speaking",
      "happy",
      "curious",
      "confused",
      "sleepy",
      "reconnecting",
      "error"
    ];

    const THEMES = {
      teo: { accent: "#65F3F8", accent2: "#A8FBFF", panel: "#092B3A", label: "Teo Cyan" },
      pink: { accent: "#FF7AB8", accent2: "#FFD6EA", panel: "#351328", label: "Pink" },
      mint: { accent: "#72F2B4", accent2: "#D7FFE9", panel: "#103527", label: "Mint" },
      violet: { accent: "#A78BFA", accent2: "#E9DDFF", panel: "#21153E", label: "Violet" },
      amber: { accent: "#FFD166", accent2: "#FFF1B8", panel: "#34270B", label: "Amber" }
    };

    const params = new URLSearchParams(window.location.search);
    const body = document.body;
    const stateControls = document.getElementById("stateControls");
    const themeControls = document.getElementById("themeControls");

    function applyTheme(theme) {
      const next = THEMES[theme] ? theme : "teo";
      const values = THEMES[next];
      body.dataset.theme = next;
      body.style.setProperty("--accent", values.accent);
      body.style.setProperty("--accent-2", values.accent2);
      body.style.setProperty("--panel", values.panel);
      for (const button of themeControls.querySelectorAll("button")) {
        button.setAttribute("aria-pressed", String(button.dataset.theme === next));
      }
      return next;
    }

    function applyState(state) {
      const next = STATES.includes(state) ? state : "idle";
      body.dataset.state = next;
      for (const button of stateControls.querySelectorAll("button")) {
        button.setAttribute("aria-pressed", String(button.dataset.state === next));
      }
      return next;
    }

    for (const state of STATES) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = state.replace("-", " ");
      button.dataset.state = state;
      button.addEventListener("click", () => applyState(state));
      stateControls.appendChild(button);
    }

    for (const [theme, config] of Object.entries(THEMES)) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "swatch";
      button.dataset.theme = theme;
      button.title = config.label;
      button.setAttribute("aria-label", config.label);
      button.addEventListener("click", () => applyTheme(theme));
      themeControls.appendChild(button);
    }

    window.TeoFace = Object.freeze({
      states: Object.freeze([...STATES]),
      themes: Object.freeze(Object.keys(THEMES)),
      setState: applyState,
      setTheme: applyTheme
    });

    window.addEventListener("message", (event) => {
      const data = event.data || {};
      if (data.type === "teobot-face:set-state") applyState(data.state);
      if (data.type === "teobot-face:set-theme") applyTheme(data.theme);
    });

    if (params.get("kiosk") === "1" || params.get("kiosk") === "true") {
      body.dataset.kiosk = "true";
    }

    applyTheme(params.get("theme") || "teo");
    applyState(params.get("state") || "idle");
  </script>
</body>
</html>
