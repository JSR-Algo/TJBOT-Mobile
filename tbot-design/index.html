<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>TBOT — Robot English Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/tokens.css"/>
<script src="/locales/bundle.js"></script>
<script src="/i18n.js" defer></script>
<style>
  body{margin:0;background:#f0eee9;}
  *{box-sizing:border-box;}
  #proto-root{font-family:var(--body);}
  .proto-stage{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at top, #fff5e6 0%, #f3e9d8 60%, #e8dec9 100%);
    padding:24px;
  }
  .proto-pill{
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    background:#fff; padding:6px 8px; border-radius:999px;
    box-shadow:0 4px 12px rgba(0,0,0,.1); display:flex; gap:4px; z-index:100;
    font-family:var(--body); font-weight:700; font-size:13px;
  }
  .proto-pill button{
    border:none; background:transparent; padding:8px 14px; border-radius:999px;
    font:inherit; color:#5C4F77; cursor:pointer;
  }
  .proto-pill button.on{ background:var(--coral); color:#fff; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.web.jsx"></script>
</body>
</html>
