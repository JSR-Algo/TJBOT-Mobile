<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>TBOT — Voice Lesson Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="tokens.css"/>
<script src="i18n.js" defer></script>
<style>
  body{margin:0;background:#f0eee9;}
  *{box-sizing:border-box;}
  /* Prototype root */
  #proto-root{font-family:var(--body);}
  .proto-stage{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at top, #fff5e6 0%, #f3e9d8 60%, #e8dec9 100%);
    padding:24px;
  }
  .proto-pill{
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    background:#fff; padding:6px 8px; border-radius:999px;
    box-shadow:0 4px 12px rgba(0,0,0,.1); display:flex; gap:4px; z-index:100;
    font-family:var(--body); font-weight:700; font-size:13px;
  }
  .proto-pill button{
    border:none; background:transparent; padding:8px 14px; border-radius:999px;
    font:inherit; color:#5C4F77; cursor:pointer;
  }
  .proto-pill button.on{ background:var(--coral); color:#fff; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="robot.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="course.jsx"></script>
<script type="text/babel" src="progress.jsx"></script>
<script type="text/babel" src="parent.jsx"></script>
<script type="text/babel" src="fallback.jsx"></script>
<script type="text/babel" src="onboarding.jsx"></script>
<script type="text/babel" src="home.jsx"></script>
<script type="text/babel" src="lcd-face.jsx"></script>
<script type="text/babel" src="lcd-system.jsx"></script>
<script type="text/babel" src="lcd-lesson.jsx"></script>
<script type="text/babel" src="lcd-face-v2.jsx"></script>
<script type="text/babel" src="lcd-v2.jsx"></script>
<script type="text/babel" src="vn-features.jsx"></script>
<script type="text/babel" src="device.jsx"></script>
<script type="text/babel" src="course-library.jsx"></script>
<script type="text/babel" src="purchase.jsx"></script>
<script type="text/babel" src="robot-mgmt.jsx"></script>
<script type="text/babel" src="design-system.jsx"></script>
<script type="text/babel" src="paths.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "view": "ds",
  "robotColor": "#E8F4FF",
  "accent": "#FF6F61",
  "intensity": "medium",
  "textSize": 22
}/*EDITMODE-END*/;

function PhoneShell({ children, label }){
  return (
    <div style={{ position:'relative' }} data-screen-label={label}>
      <IOSDevice width={390} height={844} dark={false}>
        {children}
      </IOSDevice>
    </div>
  );
}

const ALL_STATES = ONBOARDING_STATES.concat(HOME_STATES).concat(STATES).concat(COURSE_STATES).concat(PROGRESS_STATES).concat(PARENT_STATES).concat(FALLBACK_STATES).concat(DEVICE_STATES).concat(COURSE_LIB_STATES).concat(PURCHASE_STATES).concat(ROBOT_MGMT_STATES);
const ALL_SCREEN_MAP = { ...ONBOARDING_SCREEN_MAP, ...HOME_SCREEN_MAP, ...SCREEN_MAP, ...COURSE_SCREEN_MAP, ...PROGRESS_SCREEN_MAP, ...PARENT_SCREEN_MAP, ...FALLBACK_SCREEN_MAP, ...DEVICE_SCREEN_MAP, ...COURSE_LIB_SCREEN_MAP, ...PURCHASE_SCREEN_MAP, ...ROBOT_MGMT_SCREEN_MAP, home: window.S_HomeHub };
window.ALL_SCREEN_MAP = ALL_SCREEN_MAP;

function CanvasView({ tweaks }){
  const robotProps = { color: tweaks.robotColor, accent: tweaks.accent };
  // group screens into sections
  const groups = {};
  ALL_STATES.forEach(s => { (groups[s.group] = groups[s.group] || []).push(s); });

  // Render a static (non-interactive) frame per state
  const Frame = ({ id }) => {
    const Comp = ALL_SCREEN_MAP[id];
    return (
      <div style={{ width:390, height:844, overflow:'hidden', borderRadius:0, position:'relative', background:'#000'}}>
        <Comp go={()=>{}} robotProps={robotProps}/>
        {/* status bar overlay */}
        <div style={{ position:'absolute', top:0, left:0, right:0, height:54, pointerEvents:'none', display:'flex', alignItems:'center', padding:'0 28px', justifyContent:'space-between', fontFamily:'-apple-system, system-ui', fontWeight:600, fontSize:15, color:'var(--ink)' }}>
          <span>9:41</span>
          <span style={{display:'flex',gap:5,alignItems:'center'}}>
            <svg width="17" height="11" viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" rx="0.7" fill="currentColor"/><rect x="4.5" y="5" width="3" height="6" rx="0.7" fill="currentColor"/><rect x="9" y="2.5" width="3" height="8.5" rx="0.7" fill="currentColor"/><rect x="13.5" y="0" width="3" height="11" rx="0.7" fill="currentColor"/></svg>
            <svg width="22" height="11" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke="currentColor" fill="none" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2" fill="currentColor"/></svg>
          </span>
        </div>
      </div>
    );
  };

  return (
    <DesignCanvas>
      {Object.entries(groups).map(([gname, items])=>(
        <DCSection key={gname} id={gname} title={gname} subtitle={`${items.length} state${items.length>1?'s':''}`}>
          {items.map((s, i)=>(
            <DCArtboard key={s.id} id={s.id} label={`${String(ALL_STATES.indexOf(s)+1).padStart(2,'0')} · ${s.title}`} width={390} height={844}>
              <Frame id={s.id}/>
            </DCArtboard>
          ))}
        </DCSection>
      ))}
    </DesignCanvas>
  );
}

const FLOW = ['home','lesson_ready','connecting','greeting','activity_intro','robot_speaking','robot_listening','user_speaking','thinking','success','activity_done','lesson_done'];

function PrototypeView({ tweaks, setTweak }){
  const [screen, setScreen] = React.useState('onb_splash');
  const robotProps = { color: tweaks.robotColor, accent: tweaks.accent };
  const Comp = ALL_SCREEN_MAP[screen] || S_Home;
  const go = (id) => setScreen(id);

  // Quick-jump pill for non-linear states
  const quickStates = ['gentle','retry','silence','offtopic','bargein','reconnecting','audio_error','safety','exit_confirm'];

  return (
    <div className="proto-stage">
      <div style={{ position:'fixed', left:16, top:16, display:'flex', flexDirection:'column', gap:6, maxHeight:'90vh', overflow:'auto', zIndex:50, background:'rgba(255,255,255,.85)', backdropFilter:'blur(8px)', padding:10, borderRadius:14, boxShadow:'0 4px 14px rgba(0,0,0,.08)', maxWidth:180 }}>
        <div style={{ fontFamily:'var(--display)', fontWeight:700, fontSize:13, color:'#5C4F77', textTransform:'uppercase', letterSpacing:1, padding:'4px 8px' }}>Jump to</div>
        {[{id:'home',title:'Home Hub',group:'_'}].concat(ALL_STATES).map(s=>(
          <button key={s.id} onClick={()=>setScreen(s.id)} style={{
            border:'none', background: screen===s.id? 'var(--coral)':'transparent',
            color: screen===s.id? '#fff':'#2B2140',
            padding:'6px 10px', borderRadius:8, cursor:'pointer', textAlign:'left',
            fontFamily:'var(--body)', fontWeight:600, fontSize:12,
          }}>{s.title}</button>
        ))}
      </div>

      <PhoneShell label={screen}>
        <Comp go={go} robotProps={robotProps}/>
      </PhoneShell>
    </div>
  );
}

function App(){
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  return (
    <>
      <div className="proto-pill">
        <button className={t.view==='canvas'?'on':''} onClick={()=>setTweak('view','canvas')}>All Frames</button>
        <button className={t.view==='proto'?'on':''} onClick={()=>setTweak('view','proto')}>Interactive</button>
        <button className={t.view==='paths'?'on':''} onClick={()=>setTweak('view','paths')}>Paths</button>
        <button className={t.view==='ds'?'on':''} onClick={()=>setTweak('view','ds')}>Design System</button>
        <button className={t.view==='lcd'?'on':''} onClick={()=>setTweak('view','lcd')}>LCD Faces</button>
        <button className={t.view==='lesson'?'on':''} onClick={()=>setTweak('view','lesson')}>LCD Lesson</button>
        <button className={t.view==='lcdv2'?'on':''} onClick={()=>setTweak('view','lcdv2')}>LCD v2 ★</button>
        <button className={t.view==='vn'?'on':''} onClick={()=>setTweak('view','vn')}>VN ★</button>
      </div>

      {t.view === 'canvas' ? <CanvasView tweaks={t}/> : t.view === 'ds' ? <DesignSystemPage/> : t.view === 'lcd' ? <LCDFaceSystemPage/> : t.view === 'lesson' ? <LCDLessonPage/> : t.view === 'lcdv2' ? <LCDv2Page/> : t.view === 'vn' ? <VNFeaturesPage/> : t.view === 'paths' ? <PathsView tweaks={t}/> : <PrototypeView tweaks={t} setTweak={setTweak}/>}

      <TweaksPanel title="Tweaks">
        <TweakSection title="Robot">
          <TweakColor label="Body" value={t.robotColor} onChange={v=>setTweak('robotColor',v)}
            options={['#E8F4FF','#FFE2D6','#E2F7E5','#F0E5FA','#FFF3CC']}/>
          <TweakColor label="Accent" value={t.accent} onChange={v=>setTweak('accent',v)}
            options={['#FF6F61','#6FC1FF','#6CE2B6','#FFC857','#B080F0']}/>
        </TweakSection>
        <TweakSection title="View">
          <TweakRadio label="Mode" value={t.view} onChange={v=>setTweak('view',v)} options={[{value:'canvas',label:'Canvas'},{value:'proto',label:'Prototype'}]}/>
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
